url: https://github.com/2002XiaoYu/dsh-session-diff
name: 2002XiaoYu/dsh-session-diff
category: ui
description:
  en: "Session-scoped diff decoration for the DSH Web right sidebar: opening a file the current conversation changed shows git-style added/removed line backgrounds, +/− gutter markers, dual old/new line numbers, syntax colouring, a changes-only/whole-file toggle and a re-read button, plus a companion page listing every file this conversation touched; files the conversation did not touch keep the shipped text viewer."
  zh: "为 DSH Web 右侧栏提供按会话的 diff 标注：打开当前对话改过的文件时，按 git 风格显示新增/删除行背景、+/− 行标记、新旧双行号、语法高亮，以及「仅看改动 / 整个文件」切换和重新读取按钮；另有一个页面列出本次对话改过的全部文件，未被改动的文件仍走自带文本查看器。"
